[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaclip-forge"
version = "0.1.0"
description = "Crypto Shorts/TikTok clip factory — ingest, score, caption, export 9:16."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Kevin Lance Murray" }]
keywords = ["shorts", "tiktok", "ffmpeg", "crypto", "captions", "whisper"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "click>=8.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "pydantic>=2.7",
  "yt-dlp>=2024.8.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
alphaclip = "alphaclip.cli:main"

[project.urls]
Homepage = "https://github.com/HEADWOPZ/alphaclip-forge"

[tool.setuptools.packages.find]
include = ["alphaclip*"]

[tool.setuptools.package-data]
alphaclip = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
